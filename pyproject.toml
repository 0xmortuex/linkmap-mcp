[project]
name = "linkmap-mcp"
version = "0.1.0"
description = "MCP server that explains where code and data landed in a linked binary, and why - ELF + GNU ld/lld map files + linker scripts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "pyelftools>=0.31"]
keywords = ["mcp", "linker", "linker-script", "map-file", "elf", "embedded", "osdev", "firmware", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/linkmap-mcp"

[project.scripts]
linkmap-mcp = "linkmap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkmap_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
